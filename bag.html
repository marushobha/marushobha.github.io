<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Bag | Marushobha</title>
<style>
:root{--ink:#241d1a;--muted:#766b65;--line:#e8dfda;--paper:#fffdfb;--accent:#714438}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{padding:20px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:Georgia,serif;letter-spacing:3px;font-size:23px;text-decoration:none;color:var(--ink)}nav{display:flex;gap:18px}a{color:var(--accent)}nav a{font-size:14px}
main{max-width:1100px;margin:38px auto;padding:0 20px}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;margin:0 0 8px}.sub{color:var(--muted);margin-bottom:28px}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}.row img{width:110px;height:130px;object-fit:cover;background:#f5efeb}.name{font-family:Georgia,serif;font-size:20px;margin-bottom:8px}.meta{color:var(--muted);font-size:14px;line-height:1.7}.price{font-weight:600;margin-bottom:12px}.qty{display:flex;align-items:center;gap:10px;margin-top:10px}.qty button,.remove,.action{border:1px solid var(--line);background:white;padding:9px 12px;cursor:pointer;color:var(--ink)}.remove{margin-top:8px;font-size:13px}.summary{max-width:400px;margin:28px 0 0 auto;padding:22px;border:1px solid var(--line)}.total{display:flex;justify-content:space-between;font-size:18px;margin-bottom:18px}.action{display:block;text-align:center;text-decoration:none;background:var(--accent);color:white;border-color:var(--accent);padding:13px;width:100%;margin-top:10px}.empty{padding:50px 20px;text-align:center;border:1px dashed var(--line);color:var(--muted)}.empty a{display:inline-block;margin-top:14px}
@media(max-width:600px){main{margin:25px auto}.row{grid-template-columns:82px 1fr;gap:12px}.row img{width:82px;height:105px}.row .right{grid-column:2}.name{font-size:17px}.summary{margin-top:20px}}
</style></head><body>
<header><a class="brand" href="index.html">MARUSHOBHA</a><nav><a href="index.html">Continue Shopping</a><a href="wishlist.html">Wishlist</a><a href="index.html#account" id="profileLink">♙ Profile</a></nav></header>
<main><h1>Your Bag</h1><div class="sub">Review your selected pieces before checkout.</div><div id="authRequired" class="empty" hidden>Please sign in to view your personal bag.<br><a href="index.html?signin=1&return=bag.html">Sign in with Google or Mobile OTP</a></div><div id="items"></div><div id="summary"></div></main>
<script>
const CART_BASE="marushobha_cart_v1_"; function cartKey(){return window.marushobhaUid?CART_BASE+window.marushobhaUid:null;}
function read(){const k=cartKey();if(!k)return[];try{let v=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(v)?v:[]}catch{return[]}}
function save(v){const k=cartKey();if(k)localStorage.setItem(k,JSON.stringify(v))}
function money(v,display){if(display && display!=="Coming soon")return display;let n=Number(v);return Number.isFinite(n)&&n>0?"₹"+n.toLocaleString("en-IN"):"Price coming soon"}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let items=document.getElementById("items"),summary=document.getElementById("summary");const gate=document.getElementById("authRequired");if(!window.marushobhaUid){gate.hidden=false;items.innerHTML="";summary.innerHTML="";return;}gate.hidden=true;let cart=read();
if(!cart.length){items.innerHTML='<div class="empty">Your bag is empty.<br><a href="index.html">Discover the collection</a></div>';summary.innerHTML="";return}
items.innerHTML=cart.map((p,i)=>`<article class="row"><img src="${esc(p.image||"")}" alt="${esc(p.name)}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(p.name||"Product")}</div><div class="meta">Size: ${esc(p.size||"Not selected")}<br>${esc(money(p.price,p.displayPrice))}</div><div class="qty"><button onclick="changeQty(${i},-1)" aria-label="Decrease quantity">−</button><span>${Math.max(1,Number(p.quantity)||1)}</span><button onclick="changeQty(${i},1)" aria-label="Increase quantity">+</button></div><button class="remove" onclick="removeItem(${i})">Remove</button></div><div class="right price">${esc(money((Number(p.price)||0)*(Math.max(1,Number(p.quantity)||1)),null))}</div></article>`).join("");
let total=cart.reduce((s,p)=>s+(Number(p.price)||0)*Math.max(1,Number(p.quantity)||1),0),hasUnknown=cart.some(p=>!(Number(p.price)>0));
summary.innerHTML=`<section class="summary"><div class="total"><span>Subtotal</span><strong>${hasUnknown?"To be confirmed":"₹"+total.toLocaleString("en-IN")}</strong></div><div class="meta">Shipping and final charges are confirmed at checkout.</div><a class="action" href="contact.html">Proceed to Checkout</a><a class="action" style="background:white;color:var(--accent)" href="index.html">Continue Shopping</a></section>`}
function changeQty(i,d){let c=read();if(!c[i])return;c[i].quantity=Math.max(1,(Number(c[i].quantity)||1)+d);save(c);render()}
function removeItem(i){let c=read();c.splice(i,1);save(c);render()}
window.renderMarushobhaBag=render;window.addEventListener("storage",render);render();
</script><script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
const config={apiKey:"AIzaSyAX2eCSrHatv3p405XJXAq5fMsqVwDP3wQ",authDomain:"marushobha-1e31f.firebaseapp.com",projectId:"marushobha-1e31f",storageBucket:"marushobha-1e31f.firebasestorage.app",messagingSenderId:"997754535596",appId:"1:997754535596:web:aafc83bad8c3d413cf6909"};
const app=getApps().length?getApps()[0]:initializeApp(config);onAuthStateChanged(getAuth(app),user=>{window.marushobhaUid=user?.uid||null;const a=document.getElementById("profileLink");if(a)a.href=user?"index.html#account":"index.html?signin=1&return=bag.html";window.renderMarushobhaBag?.();});
</script></body></html>
