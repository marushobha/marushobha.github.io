<div class="max-w-xl mx-auto p-6 bg-white rounded-lg shadow-md border border-gray-100 my-8 font-sans">
  <h3 class="text-xl font-bold text-gray-800 mb-2">Have a Question?</h3>
  <p class="text-sm text-gray-500 mb-4">Drop your question below and we'll get back to you.</p>
  
  <!-- 
    Instructions:
    Replace YOUR_FORMSPREE_ID in the action URL with your actual Formspree form ID 
    (e.g., https://formspree.io/f/xbjwpnla)
  -->
  <form action="https://formspree.io/f/meaaobgg" method="POST" class="space-y-4">
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Your Email</label>
      <input type="email" name="email" required class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black" placeholder="you@example.com">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Your Question / Message</label>
      <textarea name="message" rows="3" required class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black" placeholder="Ask about sizing, delivery, or products..."></textarea>
    </div>

    <!-- Optional: Custom subject line so you know it's from your website -->
    <input type="hidden" name="_subject" value="New Customer Question via Marushobha FAQ">
    
    <button type="submit" class="w-full py-2 px-4 bg-black text-white text-sm font-medium rounded-md hover:bg-gray-800 transition duration-150">
      Submit Question
    </button>
  </form>
</div>
