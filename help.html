<div style="max-width: 500px; margin: 40px auto; font-family: Arial, sans-serif; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h3>Ask a Question</h3>
  <p style="color: #666; font-size: 14px;">Have a question? Type it below and it will go straight to the form.</p>
  
  <!-- Hidden iframe captures the response so the user stays on your page -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){alert('Question submitted successfully!'); document.getElementById('faq-google-form').reset(); submitted=false;}"></iframe>

  <!-- 
    Instructions:
    1. Replace YOUR_FORM_ID with your actual Google Form ID.
    2. Replace entry.YOUR_NUMBERS with your actual entry number (e.g. entry.123456789).
  -->
  <form 
    id="faq-google-form" 
    action="https://docs.google.com/forms/d/e/1FAIpQLSd7jQhaSrvyreO8erC-hapECbrJLcfSM-GVHeysINdErUsvxA/formResponse" 
    method="POST" 
    target="hidden_iframe" 
    onsubmit="submitted=true;"
  >
      <textarea 
        name="entry.51357124" 
        rows="4" 
        placeholder="Type your question here..." 
        required 
        style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;"
      ></textarea>
      
      <button 
        type="submit" 
        style="width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;"
      >
        Submit Question
      </button>
  </form>
</div>

<script>
  let submitted = false;
</script>
