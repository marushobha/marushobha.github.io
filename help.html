<form action="https://formspree.io/f/YOUR_UNIQUE_ID" method="POST" class="space-y-4 max-w-lg mx-auto bg-white p-6 rounded-lg shadow">
  <h2 class="text-xl font-bold text-gray-800 mb-4">Have a Question? Contact Us</h2>
  
  <!-- Customer Name -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Your Name</label>
    <input type="text" name="name" required class="w-full mt-1 p-2 border rounded-md" placeholder="Enter your name">
  </div>

  <!-- Customer Email (Required for direct Gmail replies) -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Your Email</label>
    <input type="email" name="email" required class="w-full mt-1 p-2 border rounded-md" placeholder="customer@example.com">
  </div>

  <!-- Order Number (Optional, helpful for your replacement policy) -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Order Number (Optional)</label>
    <input type="text" name="order_number" class="w-full mt-1 p-2 border rounded-md" placeholder="e.g. MS-1001">
  </div>

  <!-- Customer Message -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Your Message / Question</label>
    <textarea name="message" rows="4" required class="w-full mt-1 p-2 border rounded-md" placeholder="Ask about replacements, sizing, etc."></textarea>
  </div>

  <!-- Optional: Custom Subject line when it arrives in your Gmail -->
  <input type="hidden" name="_subject" value="New Customer Inquiry via Marushobha.com">

  <button type="submit" class="w-full bg-black text-white py-2 rounded-md hover:bg-gray-800 transition">
    Send Message
  </button>
</form>
