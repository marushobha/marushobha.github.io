function productImages(p){
  const found = [];
  const add = v => {
    if (!v) return;
    if (Array.isArray(v)) { v.forEach(add); return; }
    if (typeof v === "string") { found.push({src:v,alt:p.name || "Marushobha product"}); return; }
    if (typeof v === "object") {
      const src = v.src || v.url || v.imageUrl || v.image || v.downloadURL || v.downloadUrl || v.photoURL;
      if (src) found.push({src,alt:v.alt || p.name || "Marushobha product"});
    }
  };
  add(p.images); add(p.imageUrls); add(p.gallery); add(p.productImages);
  add(p.img); add(p.imageUrl); add(p.image); add(p.mainImage); add(p.photo); add(p.photoURL);
  const seen = new Set();
  return found.filter(x => { if (seen.has(x.src)) return false; seen.add(x.src); return true; });
}

async function loadProduct(){
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug") || "";
  const id = params.get("id") || "";
  const requestedName = params.get("name") || "";
  let firestoreProducts = [], jsonProducts = [...localCatalogueFallback], firestoreError = null;

  // Read products created or edited by the Admin Dashboard.
  try {
    const snap = await getDocs(collection(db, "products"));
    firestoreProducts = snap.docs.map(d => {
      const data = d.data() || {};
      const name = data.name || data.productName || data.title || "";
      return {
        ...data, id: data.id || d.id, name,
        slug: data.slug || slugFromName(name),
        description: data.description || data.productDescription || data.details || "",
        collection: data.collection || data.category || data.collectionName || "",
        colour: data.colour || data.color || data.colourName || data.colorName || "",
        fabric: data.fabric || data.material || data.composition || "",
        tag: data.tag || data.designDetails || data.details || "",
        care: data.care || data.careInstructions || "",
        images: data.images || data.imageUrls || data.gallery || data.productImages || []
      };
    });
  } catch (err) {
    firestoreError = err;
    console.error("Could not load Firestore products. Check Firebase project config, Firestore Database existence, and read rules for the products collection:", err);
  }

  // Keep products.json as a fallback for the original catalogue.
  try {
    const response = await fetch("products.json", {cache:"no-store"});
    if (response.ok) {
      const list = await response.json();
      if (Array.isArray(list)) {
        // Keep the embedded known-good catalogue if the deployed JSON is stale or incomplete.
        const combined = [...localCatalogueFallback];
        for (const entry of list) {
          const entryName = entry.name || entry.productName || entry.title || "";
          const entrySlug = entry.slug || slugFromName(entryName);
          const existing = combined.findIndex(p => (p.slug || slugFromName(p.name || p.productName || p.title)) === entrySlug);
          if (existing < 0) combined.push(entry);
          else {
            const knownGood = combined[existing];
            const getImageEntries = source => {
              const out = [];
              const add = value => {
                if (!value) return;
                if (Array.isArray(value)) { value.forEach(add); return; }
                if (typeof value === "string") { out.push({src:value, alt:knownGood.name || entryName}); return; }
                if (typeof value === "object") {
                  const src = value.src || value.url || value.imageUrl || value.image || value.downloadURL || value.downloadUrl || value.photoURL;
                  if (src) out.push({src, alt:value.alt || knownGood.name || entryName});
                }
              };
              [source.images, source.imageUrls, source.gallery, source.productImages,
               source.img, source.imageUrl, source.image, source.mainImage, source.photo, source.photoURL].forEach(add);
              return out;
            };
            // Preserve the embedded catalogue's exact image paths first; append JSON images as extras.
            const prioritizedImages = [...getImageEntries(knownGood), ...getImageEntries(entry)];
            const seen = new Set();
            const uniqueImages = prioritizedImages.filter(im => {
              if (seen.has(im.src)) return false;
              seen.add(im.src);
              return true;
            });
            combined[existing] = {...knownGood, ...entry,
              images: uniqueImages.length ? uniqueImages : knownGood.images,
              img: knownGood.img || entry.img || entry.imageUrl || knownGood.imageUrl};
          }
        }
        jsonProducts = combined;
      }
    }
  } catch (err) {
    console.warn("products.json fallback could not be loaded:", err);
  }

  // Merge both sources instead of discarding products.json records when a
  // Firestore product has the same slug. Older catalogue images often live
  // in products.json/assets, while Firestore may only contain product details.
  const allProducts = [...firestoreProducts];
  for (const item of jsonProducts) {
    const itemName = item.name || item.productName || item.title || "";
    const itemSlug = item.slug || slugFromName(itemName);
    const index = allProducts.findIndex(p =>
      (p.id && item.id && String(p.id) === String(item.id)) ||
      ((p.slug || slugFromName(p.name || p.productName || p.title)) &&
       (p.slug || slugFromName(p.name || p.productName || p.title)) === itemSlug)
    );
    if (index === -1) {
      allProducts.push({...item, name:itemName, slug:itemSlug});
    } else {
      const current = allProducts[index];
      const hasImageValue = value => {
        if (typeof value === "string") return !!value.trim();
        if (Array.isArray(value)) return value.some(hasImageValue);
        if (value && typeof value === "object") return !!(value.src || value.url || value.imageUrl || value.image || value.downloadURL || value.downloadUrl || value.photoURL);
        return false;
      };
      const collectImages = source => {
        const out = [];
        const add = value => {
          if (!value) return;
          if (Array.isArray(value)) { value.forEach(add); return; }
          if (typeof value === "string") { out.push({src:value, alt:itemName}); return; }
          if (typeof value === "object") {
            const src = value.src || value.url || value.imageUrl || value.image || value.downloadURL || value.downloadUrl || value.photoURL;
            if (src) out.push({src, alt:value.alt || itemName});
          }
        };
        [source.images, source.imageUrls, source.gallery, source.productImages,
         source.img, source.imageUrl, source.image, source.mainImage, source.photo, source.photoURL].forEach(add);
        return out;
      };
      // Keep image URLs from BOTH sources. Firestore can contain an empty
      // images array while the original images are still in products.json.
      const mergedImages = [...collectImages(item), ...collectImages(current)];
      const seenImageUrls = new Set();
      const uniqueImages = mergedImages.filter(image => {
        if (seenImageUrls.has(image.src)) return false;
        seenImageUrls.add(image.src);
        return true;
      });
      allProducts[index] = {
        ...item,
        ...current,
        name: current.name || current.productName || current.title || itemName,
        slug: current.slug || itemSlug,
        images: uniqueImages,
        img: item.img || item.imageUrl || current.img || current.imageUrl || "",
        imageUrl: item.imageUrl || item.img || current.imageUrl || current.img || ""
      };
    }
  }

  product = allProducts.find(p =>
    (id && String(p.id) === id) ||
    (slug && (p.slug || slugFromName(p.name || p.productName || p.title)) === slug) ||
    (requestedName && String(p.name || p.productName || p.title).toLowerCase() === requestedName.toLowerCase())
  );

  if (!product) {
    const message = firestoreError
      ? "Firebase products could not be read. Check Firestore read rules and the browser console."
      : "Return to the shop and select the product again. Confirm the new product exists in Firestore Database → products.";
    $("productRoot").innerHTML = `<div class="error"><strong>Product not found.</strong><p>${esc(message)}</p><a class="back" href="index.html#shop">Back to Shop</a></div>`;
    return;
  }

  product.name = product.name || product.productName || product.title || "Marushobha Product";
  product.slug = product.slug || slugFromName(product.name);
  images = productImages(product);
  document.title = `${product.name} | Marushobha`;
  $("crumbName").textContent = product.name;
  if (!images.length) {
    $("productRoot").innerHTML = `<div class="error"><strong>Product details loaded, but no image was found.</strong><p>Check the image fields in its Firestore document: img, imageUrl, or images.</p></div>`;
    return;
  }
  render();
}

const WISHLIST_KEY = "marushobha_wishlist_v1";
function readStore(key){
  try { const value = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(value) ? value : []; }
  catch { return []; }
}
function writeStore(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (err) { console.error("Could not save Marushobha bag/wishlist in this browser:", err); return false; }
}
function currentProductRecord(){
  const size = $("sizeSelect")?.value || (product.sizes || ["XS","S","M","L"])[0];
  const unitPrice = typeof product.price === "number" ? product.price : Number(String(product.price || "").replace(/[^0-9.]/g,"")) || null;
  return {
    key: String(product.slug || slugFromName(product.name)) + "::" + size,
    productId: String(product.id ?? product.slug ?? slugFromName(product.name)),
    slug: product.slug || slugFromName(product.name),
    name: product.name,
    image: images[0]?.src || "",
    price: unitPrice,
    displayPrice: fmt(product.price),
    size,
    quantity: 1,
    addedAt: new Date().toISOString()
  };
}
function updateBagWishlistCounts(){
  const cart = readStore(CART_KEY), wishlist = readStore(WISHLIST_KEY);
  const bagCount = cart.reduce((sum,item)=>sum + Math.max(1, Number(item.quantity) || 1),0);
  if ($("bagCount")) $("bagCount").textContent = String(bagCount);
  if ($("wishlistCount")) $("wishlistCount").textContent = String(wishlist.length);
}
function showActionMessage(message){
  const el = $("actionMessage");
  if (el) el.textContent = message;
}
function addCurrentProductToBag(){
  const item = currentProductRecord();
  const cart = readStore(CART_KEY);
  const existing = cart.find(row => row.key === item.key);
  if (existing) existing.quantity = Math.max(1, Number(existing.quantity) || 1) + 1;
  else cart.push(item);
  if (!writeStore(CART_KEY, cart)) { showActionMessage("Could not save your bag. Please enable browser storage and try again."); return; }
  updateBagWishlistCounts();
  showActionMessage(`${product.name} (Size ${item.size}) added to your bag.`);
  $("addToBag").textContent = "✓ Added to Bag";
  setTimeout(()=>{ if ($("addToBag")) $("addToBag").textContent = "Add to Bag"; }, 1600);
}
function addCurrentProductToWishlist(){
  const item = currentProductRecord();
  const wishlist = readStore(WISHLIST_KEY);
  const existing = wishlist.some(row => row.productId === item.productId);
  if (existing) {
    showActionMessage(`${product.name} is already in your wishlist.`);
    return;
  }
  wishlist.push({...item, key:item.productId});
  if (!writeStore(WISHLIST_KEY, wishlist)) { showActionMessage("Could not save your wishlist. Please enable browser storage and try again."); return; }
  updateBagWishlistCounts();
  showActionMessage(`${product.name} added to your wishlist.`);
  $("addToWishlist").textContent = "♥ Wishlisted";
  setTimeout(()=>{ if ($("addToWishlist")) $("addToWishlist").textContent = "♡ Add to Wishlist"; }, 1600);
}
window.addEventListener("storage", updateBagWishlistCounts);

function render(){
  const thumbs = images.map((im,i)=>`<button class="thumb ${i===activeIndex?'active':''}" data-thumb="${i}" aria-label="Show image ${i+1}"><img src="${esc(im.src)}" alt="${esc(im.alt)}"></button>`).join("");
  $("productRoot").innerHTML = `<section class="layout">
    <div class="gallery">
      <div class="hero-wrap"><img class="hero-img" id="heroImage" src="${esc(images[activeIndex].src)}" alt="${esc(images[activeIndex].alt)}" title="Click to zoom"><div class="gallery-actions"><button id="openZoom" type="button">⤢ Zoom image</button></div></div>
      <div class="thumbs" aria-label="Product images">${thumbs}</div>
    </div>
    <div class="info">
      <div class="eyebrow">${esc(product.collection || product.category || "Marushobha Collection")}</div>
      <h1>${esc(product.name)}</h1><div class="price">${esc(fmt(product.price))}</div>
      <p class="description">${esc(product.description || "")}</p>
      <div class="details">
        <div class="detail-row"><strong>Colour</strong>${esc(product.colour || "As shown")}</div>
        <div class="detail-row"><strong>Fabric & Composition</strong>${esc(product.fabric || "Refer to product label")}</div>
        <div class="detail-row"><strong>Design Details</strong>${esc(product.tag || "See product images and description")}</div>
        <div class="detail-row"><strong>Available Sizes</strong>${esc((product.sizes || ["XS","S","M","L"]).join(", "))}</div>
        <div class="detail-row"><strong>Care Instructions</strong>${esc(product.care || "Follow the garment care label.")}</div>
      </div>
      <label class="size-label" for="sizeSelect">Select Size</label><select class="size-select" id="sizeSelect">${(product.sizes || ["XS","S","M","L"]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
      <div class="purchase-actions">
        <button class="add-bag" id="addToBag" type="button">Add to Bag</button>
        <button class="add-wishlist" id="addToWishlist" type="button">♡ Add to Wishlist</button>
      </div>
      <p class="action-message" id="actionMessage" role="status" aria-live="polite"></p>
      <p class="note">Your bag and wishlist are saved in this browser. For availability, sizing or product queries, please contact Marushobha.</p>
      <p><a class="back" href="index.html#shop">Continue Shopping</a></p>
    </div>
  </section>`;
  $("heroImage").addEventListener("click",openZoom);
  updateBagWishlistCounts();
  $("addToBag").addEventListener("click", addCurrentProductToBag);
  $("addToWishlist").addEventListener("click", addCurrentProductToWishlist);
  $("openZoom").addEventListener("click",openZoom);
  // If a selected gallery image is broken, automatically try another image.
  $("heroImage").addEventListener("error", () => {
    const img = $("heroImage");
    if (!img || img.dataset.fallbackTried === "1") return;
    failedImageSources.add(images[activeIndex]?.src);
    const next = images.findIndex((im, i) => i !== activeIndex && !failedImageSources.has(im.src));
    if (next >= 0) { activeIndex = next; render(); }
    else { img.alt = "Product image unavailable"; img.style.display = "none"; }
  }, {once:true});
  document.querySelectorAll("[data-thumb]").forEach(b=>b.addEventListener("click",()=>{activeIndex=Number(b.dataset.thumb);render();}));
  document.querySelectorAll(".thumb img").forEach(img=>img.addEventListener("error",()=>{img.closest(".thumb")?.classList.add("image-unavailable"); img.style.visibility="hidden";},{once:true}));
}
function updateZoom(){ $("lightboxImg").style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`; }
function setImage(){
  const img = $("lightboxImg");
  img.onerror = () => {
    img.onerror = null;
    failedImageSources.add(images[activeIndex]?.src);
    const next = images.findIndex((im, i) => i !== activeIndex && !failedImageSources.has(im.src));
    if (next >= 0) { activeIndex = next; setImage(); render(); }
    else { img.alt = "Product image unavailable"; img.style.display = "none"; }
  };
  img.style.display = "";
  img.src = images[activeIndex].src;
  img.alt = images[activeIndex].alt || product.name;
  zoom=1;panX=0;panY=0;updateZoom();
}
function openZoom(){setImage();$("lightbox").classList.add("open");document.body.style.overflow="hidden";}
function closeZoom(){$("lightbox").classList.remove("open");document.body.style.overflow="";}
function changeImage(delta){activeIndex=(activeIndex+delta+images.length)%images.length;setImage();render();}
$("closeZoom").addEventListener("click",closeZoom);
$("zoomIn").addEventListener("click",()=>{zoom=Math.min(zoom+0.35,4);updateZoom();});
$("zoomOut").addEventListener("click",()=>{zoom=Math.max(1,zoom-0.35);if(zoom===1){panX=0;panY=0;}updateZoom();});
$("zoomReset").addEventListener("click",()=>{zoom=1;panX=0;panY=0;updateZoom();});
$("prevImage").addEventListener("click",()=>changeImage(-1));
$("nextImage").addEventListener("click",()=>changeImage(1));
$("lightbox").addEventListener("click",e=>{if(e.target===$("lightbox"))closeZoom();});
document.addEventListener("keydown",e=>{if(!$("lightbox").classList.contains("open"))return;if(e.key==="Escape")closeZoom();if(e.key==="ArrowLeft")changeImage(-1);if(e.key==="ArrowRight")changeImage(1);if(e.key==="+"){$("zoomIn").click();}if(e.key==="-"){$("zoomOut").click();}});
$("lightboxInner").addEventListener("wheel",e=>{if(!$("lightbox").classList.contains("open"))return;e.preventDefault();zoom=Math.max(1,Math.min(4,zoom+(e.deltaY<0?.15:-.15)));updateZoom();},{passive:false});
let pointers=new Map(), pinchStartDist=0, pinchStartZoom=1, dragStart=null;
const inner=$("lightboxInner"), zoomImg=$("lightboxImg");
inner.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  inner.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const a=[...pointers.values()];pinchStartDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchStartZoom=zoom;}
  else if(pointers.size===1 && zoom>1){dragStart={x:e.clientX,y:e.clientY,px:panX,py:panY};zoomImg.classList.add("dragging");}
});
inner.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const a=[...pointers.values()];const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStartDist)zoom=Math.max(1,Math.min(4,pinchStartZoom*dist/pinchStartDist));if(zoom===1){panX=0;panY=0;}updateZoom();}
  else if(pointers.size===1 && dragStart && zoom>1){panX=dragStart.px+e.clientX-dragStart.x;panY=dragStart.py+e.clientY-dragStart.y;updateZoom();}
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStartDist=0;if(!pointers.size){dragStart=null;zoomImg.classList.remove("dragging");}}
inner.addEventListener("pointerup",endPointer);inner.addEventListener("pointercancel",endPointer);
let touchStartX=0;
inner.addEventListener("touchstart",e=>{if(e.touches.length===1)touchStartX=e.touches[0].clientX;},{passive:true});
inner.addEventListener("touchend",e=>{if(e.changedTouches.length===1 && zoom===1){const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>70)changeImage(dx<0?1:-1);}},{passive:true});
loadProduct();
</script>
</body>
