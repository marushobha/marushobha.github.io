<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marushobha - Product Collection</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-10 w-full">
    <header class="mb-10 text-center">
      <h1 class="text-3xl font-serif font-medium tracking-wide">Marushobha Collection</h1>
      <p class="text-sm text-gray-600 mt-1">Custom. Character. Class.</p>
    </header>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Dynamic products injected via JavaScript -->
    </div>
  </main>

  <!-- Product Detail Modal (First Click) -->
  <div id="product-detail-modal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden relative max-h-[90vh] flex flex-col">
      <button onclick="closeProductDetail()" class="absolute top-4 right-4 z-10 bg-gray-100 hover:bg-gray-200 p-2 rounded-full transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
      <div id="detail-content" class="p-6 md:p-8 overflow-y-auto">
        <!-- Dynamic detail content injected here -->
      </div>
    </div>
  </div>

  <!-- Full-Screen Lightbox Modal (Second Click / Expand) -->
  <div id="fullscreen-lightbox" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <button onclick="closeFullScreenModal()" class="absolute top-5 right-5 text-white bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-all">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    <img id="lightbox-img" src="" class="max-h-[90vh] max-w-[90vw] object-contain rounded-md shadow-2xl" alt="Full Screen View">
  </div>

  <!-- Core Script Integration -->
  <script>
    // Global variable to hold your fetched products from Firestore/Database
    let activeProducts = [];

    // Call this function when you load/fetch your products from Firebase
    function initProductGallery(productsFromDB) {
      activeProducts = productsFromDB;
      const grid = document.getElementById('product-grid');
      
      grid.innerHTML = activeProducts.map(product => {
        // Fallback checks for image structures (supports `product.images` array or single `product.imageUrl`)
        const images = product.images && product.images.length > 0 
          ? product.images 
          : (product.imageUrl ? [product.imageUrl] : []);
        
        const mainImage = images.length > 0 ? images[0] : '';

        return `
          <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden flex flex-col">
            <!-- Main Product Image (Click to open detail view) -->
            <div class="relative group cursor-pointer aspect-[3/4] bg-gray-50 overflow-hidden" onclick="openProductDetail('${product.id}')">
              <img id="main-img-${product.id}" 
                   src="${mainImage}" 
                   alt="${product.name || 'Product'}" 
                   class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105">
                   
              ${images.length > 1 ? `
                <span class="absolute bottom-2 right-2 bg-black/65 text-white text-xs px-2 py-0.5 rounded-full backdrop-blur-sm">
                  1/${images.length}
                </span>
              ` : ''}
            </div>

            <!-- Mobile & Desktop Multi-Image Thumbnails -->
            ${images.length > 1 ? `
              <div class="flex gap-1.5 p-2 overflow-x-auto scrollbar-none bg-gray-50/50 border-t border-gray-100">
                ${images.map((imgUrl, index) => `
                  <button onclick="switchImage('${product.id}', '${imgUrl}', event)" 
                          class="w-10 h-12 flex-shrink-0 rounded overflow-hidden border ${index === 0 ? 'border-black ring-1 ring-black' : 'border-gray-200 opacity-70 hover:opacity-100'} transition-all">
                    <img src="${imgUrl}" class="w-full h-full object-cover" alt="Thumbnail">
                  </button>
                `).join('')}
              </div>
            ` : ''}

            <!-- Product Info -->
            <div class="p-4 flex flex-col flex-grow">
              <h3 class="text-sm font-medium text-gray-900 line-clamp-1 cursor-pointer" onclick="openProductDetail('${product.id}')">
                ${product.name}
              </h3>
              <p class="text-sm font-semibold text-gray-900 mt-1">₹${product.price}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    // Switch active image on card via thumbnails
    function switchImage(productId, imageUrl, event) {
      event.stopPropagation();
      const mainImg = document.getElementById(`main-img-${productId}`);
      if (mainImg) mainImg.src = imageUrl;

      const button = event.currentTarget;
      const container = button.parentElement;
      container.querySelectorAll('button').forEach(btn => {
        btn.classList.remove('border-black', 'ring-1', 'ring-black', 'opacity-100');
        btn.classList.add('border-gray-200', 'opacity-70');
      });
      button.classList.remove('border-gray-200', 'opacity-70');
      button.classList.add('border-black', 'ring-1', 'ring-black', 'opacity-100');
    }

    // Open Product Detail Interface (First Click)
    function openProductDetail(productId) {
      const product = activeProducts.find(p => p.id === productId);
      if (!product) return;

      const images = product.images && product.images.length > 0 
        ? product.images 
        : (product.imageUrl ? [product.imageUrl] : []);
      
      window.currentActiveImgUrl = images.length > 0 ? images[0] : '';
      const detailModal = document.getElementById('product-detail-modal');

      document.getElementById('detail-content').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
          <div class="space-y-4">
            <div class="relative aspect-[3/4] bg-gray-100 rounded-lg overflow-hidden cursor-pointer group" onclick="openFullScreenModal(window.currentActiveImgUrl)">
              <img id="detail-main-img" src="${window.currentActiveImgUrl}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-102" alt="Product View">
              <div class="absolute bottom-3 right-3 bg-black/70 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 backdrop-blur-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/>
                </svg>
                Click to expand
              </div>
            </div>
            
            ${images.length > 1 ? `
              <div class="flex gap-2 overflow-x-auto pb-2">
                ${images.map(img => `
                  <img src="${img}" onclick="setDetailMainImage('${img}')" class="w-16 h-20 object-cover rounded cursor-pointer border hover:border-black transition-all" alt="Thumbnail">
                `).join('')}
              </div>
            ` : ''}
          </div>

          <div class="flex flex-col justify-between h-full">
            <div>
              <h2 class="text-2xl font-serif font-medium text-gray-900">${product.name}</h2>
              <p class="text-xl font-semibold text-gray-900 mt-2">₹${product.price}</p>
              <p class="text-gray-600 mt-4 text-sm leading-relaxed">${product.description || ''}</p>
            </div>
            
            <button onclick="addToBag('${product.id}')" class="w-full bg-black text-white py-3 rounded-md hover:bg-gray-800 transition-colors mt-8">
              Add to Bag
            </button>
          </div>
        </div>
      `;

      detailModal.classList.remove('hidden');
    }

    function closeProductDetail() {
      document.getElementById('product-detail-modal').classList.add('hidden');
    }

    function setDetailMainImage(url) {
      window.currentActiveImgUrl = url;
      document.getElementById('detail-main-img').src = url;
    }

    // Open Full-Screen Lightbox View (Second Click)
    function openFullScreenModal(imgUrl) {
      if (!imgUrl) return;
      document.getElementById('lightbox-img').src = imgUrl;
      document.getElementById('fullscreen-lightbox').classList.remove('hidden');
    }

    function closeFullScreenModal() {
      document.getElementById('fullscreen-lightbox').classList.add('hidden');
    }
  </script>
</body>
</html>
