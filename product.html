<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f4ed">
<title>Product | Marushobha</title>
<style>
:root{--ivory:#f8f4ed;--ink:#28221e;--brown:#6e4b36;--muted:#766e66;--line:#e3d9ce;--white:#fffdf9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}a{color:inherit;text-decoration:none}button,select{font:inherit;cursor:pointer}.topbar{border-bottom:1px solid var(--line);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--ivory)}.brand{font-family:Georgia,serif;letter-spacing:.18em;font-size:1.1rem}.tagline{font-size:.65rem;letter-spacing:.15em;color:var(--muted);display:block}.back{border:1px solid var(--brown);padding:9px 14px;background:transparent;color:var(--brown)}main{max-width:1180px;margin:0 auto;padding:34px 24px 70px}.crumb{font-size:.82rem;color:var(--muted);margin-bottom:22px}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:42px}.gallery{min-width:0}.hero-wrap{position:relative;background:#eee7df;overflow:hidden;touch-action:pan-y}.hero-img{width:100%;height:auto;max-height:78vh;aspect-ratio:3/4;object-fit:contain;display:block;cursor:zoom-in}.gallery-actions{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}.gallery-actions button,.zoom-controls button{border:1px solid #d8cec3;background:#fffdf9eF;padding:8px 12px}.thumbs{display:flex;gap:10px;overflow-x:auto;padding:12px 0}.thumb{width:76px;height:96px;flex:0 0 auto;border:1px solid var(--line);padding:2px;background:transparent}.thumb.active{border:2px solid var(--brown)}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.info{padding-top:8px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--brown);font-size:.75rem}.info h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(1.8rem,3vw,2.7rem);line-height:1.2;margin:10px 0}.price{font-size:1.1rem;font-weight:bold;margin:12px 0 20px}.description{color:#514941}.details{border-top:1px solid var(--line);margin-top:24px}.detail-row{padding:13px 0;border-bottom:1px solid var(--line)}.detail-row strong{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.size-label{display:block;font-weight:bold;margin:22px 0 8px}.size-select{width:100%;max-width:260px;padding:12px;border:1px solid #cfc3b6;background:var(--white)}.note{font-size:.82rem;color:var(--muted);margin-top:15px}.error{background:#fff4f0;border:1px solid #e3b9ac;padding:18px}.lightbox{position:fixed;inset:0;background:#17120ff2;z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox-inner{position:relative;width:min(100%,1100px);height:min(94vh,1000px);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}.lightbox-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none;cursor:grab}.lightbox-img.dragging{cursor:grabbing}.lightbox-top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:10px;z-index:2}.lightbox-top button,.lightbox-nav{background:#fffdf9;border:0;padding:10px 13px}.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:1.4rem}.lightbox-prev{left:8px}.lightbox-next{right:8px}.zoom-controls{display:flex;gap:6px}.zoom-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:white;background:#0008;padding:6px 10px;font-size:.75rem;white-space:nowrap}@media(max-width:760px){main{padding:22px 15px 45px}.topbar{padding:12px 15px}.layout{grid-template-columns:1fr;gap:20px}.hero-img{max-height:none;aspect-ratio:4/5}.info{padding-top:0}.thumb{width:66px;height:84px}.lightbox{padding:6px}.lightbox-inner{height:96vh}.lightbox-nav{padding:8px 10px}.zoom-hint{font-size:.68rem;bottom:5px}.lightbox-top button{padding:8px 10px}}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" aria-label="Marushobha home"><span class="brand">MARUSHOBHA</span><span class="tagline">CUSTOM. CHARACTER. CLASS.</span></a>
  <a class="back" href="index.html#shop">← Back to Shop</a>
</header>
<main>
  <div class="crumb"><a href="index.html">Home</a> / <a href="index.html#shop">Shop</a> / <span id="crumbName">Product</span></div>
  <div id="productRoot"><p>Loading product details…</p></div>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Product image zoom">
  <div class="lightbox-inner" id="lightboxInner">
    <div class="lightbox-top">
      <button id="closeZoom" type="button" aria-label="Close image viewer">✕ Close</button>
      <div class="zoom-controls"><button id="zoomOut" type="button" aria-label="Zoom out">−</button><button id="zoomReset" type="button">Reset</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button></div>
    </div>
    <button class="lightbox-nav lightbox-prev" id="prevImage" type="button" aria-label="Previous image">‹</button>
    <img class="lightbox-img" id="lightboxImg" alt="">
    <button class="lightbox-nav lightbox-next" id="nextImage" type="button" aria-label="Next image">›</button>
    <div class="zoom-hint">Pinch to zoom on mobile · Use + / − or mouse wheel</div>
  </div>
</div>
<script>
const fmt = value => typeof value === "number" ? "₹" + value.toLocaleString("en-IN") : (value || "COMING SOON");
const slugFromName = name => (name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let product = null, images = [], activeIndex = 0, zoom = 1, panX = 0, panY = 0;
const $ = id => document.getElementById(id);
function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function productImages(p){
  const arr = Array.isArray(p.images) ? p.images.map(x=>typeof x==="string"?{src:x,alt:p.name}:{src:x.src||x.url||x.image,alt:x.alt||p.name}).filter(x=>x.src) : [];
  if(!arr.length && (p.img||p.imageUrl)) arr.push({src:p.img||p.imageUrl,alt:p.name});
  return arr;
}
async function loadProduct(){
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug") || "";
  const id = params.get("id");
  try{
    const response = await fetch("products.json", {cache:"no-store"});
    if(!response.ok) throw new Error("products.json could not be loaded");
    const list = await response.json();
    product = list.find(p => (p.slug || slugFromName(p.name)) === slug || (id && String(p.id) === id));
  }catch(err){
    $("productRoot").innerHTML = `<div class="error"><strong>Could not load product data.</strong><p>Please open this website through your hosting URL, not directly as a file, and make sure products.json is uploaded beside product.html.</p><p>${esc(err.message)}</p></div>`;
    return;
  }
  if(!product){$("productRoot").innerHTML='<div class="error"><strong>Product not found.</strong><p>Return to the shop and select the product again.</p><a class="back" href="index.html#shop">Back to Shop</a></div>';return;}
  images = productImages(product);
  if(!images.length){$("productRoot").innerHTML='<div class="error">No product images are listed for this item in products.json.</div>';return;}
  document.title = `${product.name} | Marushobha`;
  $("crumbName").textContent = product.name;
  render();
}
function render(){
  const thumbs = images.map((im,i)=>`<button class="thumb ${i===activeIndex?'active':''}" data-thumb="${i}" aria-label="Show image ${i+1}"><img src="${esc(im.src)}" alt="${esc(im.alt)}"></button>`).join("");
  $("productRoot").innerHTML = `<section class="layout">
    <div class="gallery">
      <div class="hero-wrap"><img class="hero-img" id="heroImage" src="${esc(images[activeIndex].src)}" alt="${esc(images[activeIndex].alt)}" title="Click to zoom"><div class="gallery-actions"><button id="openZoom" type="button">⤢ Zoom image</button></div></div>
      <div class="thumbs" aria-label="Product images">${thumbs}</div>
    </div>
    <div class="info">
      <div class="eyebrow">${esc(product.collection || product.category || "Marushobha Collection")}</div>
      <h1>${esc(product.name)}</h1><div class="price">${esc(fmt(product.price))}</div>
      <p class="description">${esc(product.description || "")}</p>
      <div class="details">
        <div class="detail-row"><strong>Colour</strong>${esc(product.colour || "As shown")}</div>
        <div class="detail-row"><strong>Fabric & Composition</strong>${esc(product.fabric || "Refer to product label")}</div>
        <div class="detail-row"><strong>Design Details</strong>${esc(product.tag || "See product images and description")}</div>
        <div class="detail-row"><strong>Available Sizes</strong>${esc((product.sizes || ["XS","S","M","L"]).join(", "))}</div>
        <div class="detail-row"><strong>Care Instructions</strong>${esc(product.care || "Follow the garment care label.")}</div>
      </div>
      <label class="size-label" for="sizeSelect">Select Size</label><select class="size-select" id="sizeSelect">${(product.sizes || ["XS","S","M","L"]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
      <p class="note">For availability, sizing or product queries, please contact Marushobha before placing your order.</p>
      <p><a class="back" href="index.html#shop">Continue Shopping</a></p>
    </div>
  </section>`;
  $("heroImage").addEventListener("click",openZoom);
  $("openZoom").addEventListener("click",openZoom);
  document.querySelectorAll("[data-thumb]").forEach(b=>b.addEventListener("click",()=>{activeIndex=Number(b.dataset.thumb);render();}));
}
function updateZoom(){ $("lightboxImg").style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`; }
function setImage(){ $("lightboxImg").src=images[activeIndex].src; $("lightboxImg").alt=images[activeIndex].alt||product.name; zoom=1;panX=0;panY=0;updateZoom(); }
function openZoom(){setImage();$("lightbox").classList.add("open");document.body.style.overflow="hidden";}
function closeZoom(){$("lightbox").classList.remove("open");document.body.style.overflow="";}
function changeImage(delta){activeIndex=(activeIndex+delta+images.length)%images.length;setImage();render();}
$("closeZoom").addEventListener("click",closeZoom);
$("zoomIn").addEventListener("click",()=>{zoom=Math.min(zoom+0.35,4);updateZoom();});
$("zoomOut").addEventListener("click",()=>{zoom=Math.max(1,zoom-0.35);if(zoom===1){panX=0;panY=0;}updateZoom();});
$("zoomReset").addEventListener("click",()=>{zoom=1;panX=0;panY=0;updateZoom();});
$("prevImage").addEventListener("click",()=>changeImage(-1));
$("nextImage").addEventListener("click",()=>changeImage(1));
$("lightbox").addEventListener("click",e=>{if(e.target===$("lightbox"))closeZoom();});
document.addEventListener("keydown",e=>{if(!$("lightbox").classList.contains("open"))return;if(e.key==="Escape")closeZoom();if(e.key==="ArrowLeft")changeImage(-1);if(e.key==="ArrowRight")changeImage(1);if(e.key==="+"){$("zoomIn").click();}if(e.key==="-"){$("zoomOut").click();}});
$("lightboxInner").addEventListener("wheel",e=>{if(!$("lightbox").classList.contains("open"))return;e.preventDefault();zoom=Math.max(1,Math.min(4,zoom+(e.deltaY<0?.15:-.15)));updateZoom();},{passive:false});
let pointers=new Map(), pinchStartDist=0, pinchStartZoom=1, dragStart=null;
const inner=$("lightboxInner"), zoomImg=$("lightboxImg");
inner.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  inner.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const a=[...pointers.values()];pinchStartDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchStartZoom=zoom;}
  else if(pointers.size===1 && zoom>1){dragStart={x:e.clientX,y:e.clientY,px:panX,py:panY};zoomImg.classList.add("dragging");}
});
inner.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const a=[...pointers.values()];const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStartDist)zoom=Math.max(1,Math.min(4,pinchStartZoom*dist/pinchStartDist));if(zoom===1){panX=0;panY=0;}updateZoom();}
  else if(pointers.size===1 && dragStart && zoom>1){panX=dragStart.px+e.clientX-dragStart.x;panY=dragStart.py+e.clientY-dragStart.y;updateZoom();}
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStartDist=0;if(!pointers.size){dragStart=null;zoomImg.classList.remove("dragging");}}
inner.addEventListener("pointerup",endPointer);inner.addEventListener("pointercancel",endPointer);
let touchStartX=0;
inner.addEventListener("touchstart",e=>{if(e.touches.length===1)touchStartX=e.touches[0].clientX;},{passive:true});
inner.addEventListener("touchend",e=>{if(e.changedTouches.length===1 && zoom===1){const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>70)changeImage(dx<0?1:-1);}},{passive:true});
loadProduct();
</script>
</body>
</html>
