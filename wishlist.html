<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Wishlist | Marushobha</title>
<style>
:root{--ink:#241d1a;--muted:#766b65;--line:#e8dfda;--paper:#fffdfb;--accent:#714438}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{padding:20px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-family:Georgia,serif;letter-spacing:3px;font-size:23px;text-decoration:none;color:var(--ink)}nav{display:flex;gap:18px}a{color:var(--accent)}nav a{font-size:14px}
main{max-width:1100px;margin:38px auto;padding:0 20px}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;margin:0 0 8px}.sub{color:var(--muted);margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{border:1px solid var(--line);padding:12px}.card img{width:100%;height:300px;object-fit:cover;background:#f5efeb}.name{font-family:Georgia,serif;font-size:20px;margin:14px 0 7px}.meta{color:var(--muted);font-size:14px;line-height:1.6}.buttons{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.buttons button{border:1px solid var(--line);background:white;padding:10px;cursor:pointer;color:var(--ink)}.buttons .primary{background:var(--accent);border-color:var(--accent);color:white}.empty{padding:50px 20px;text-align:center;border:1px dashed var(--line);color:var(--muted)}.empty a{display:inline-block;margin-top:14px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:230px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.card img{height:320px}}
</style></head><body>
<header><a class="brand" href="index.html">MARUSHOBHA</a><nav><a href="index.html">Continue Shopping</a><a href="bag.html">Bag</a><a href="index.html#account" id="profileLink">♙ Profile</a></nav></header>
<main><h1>Your Wishlist</h1><div class="sub">Your saved Marushobha favourites.</div><div id="authRequired" class="empty" hidden>Please sign in to view your personal wishlist.<br><a href="index.html?signin=1&return=wishlist.html">Sign in with Google or Mobile OTP</a></div><div id="items"></div></main>
<script>
const WISH_BASE="marushobha_wishlist_v1_",CART_BASE="marushobha_cart_v1_";function wishKey(){return window.marushobhaUid?WISH_BASE+window.marushobhaUid:null}function cartKey(){return window.marushobhaUid?CART_BASE+window.marushobhaUid:null}
function read(base){const k=base===WISH_BASE?wishKey():cartKey();if(!k)return[];try{let v=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(v)?v:[]}catch{return[]}}
function save(base,v){const k=base===WISH_BASE?wishKey():cartKey();if(k)localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v,d){if(d&&d!=="Coming soon")return d;let n=Number(v);return Number.isFinite(n)&&n>0?"₹"+n.toLocaleString("en-IN"):"Price coming soon"}
function render(){let el=document.getElementById("items");if(!window.marushobhaUid){document.getElementById("authRequired").hidden=false;el.innerHTML="";return;}document.getElementById("authRequired").hidden=true;let list=read(WISH_BASE);if(!list.length){el.innerHTML='<div class="empty">Your wishlist is empty.<br><a href="index.html">Discover the collection</a></div>';return}
el.innerHTML='<div class="grid">'+list.map((p,i)=>`<article class="card"><img src="${esc(p.image||"")}" alt="${esc(p.name)}" onerror="this.style.visibility='hidden'"><div class="name">${esc(p.name||"Product")}</div><div class="meta">Size: ${esc(p.size||"Choose on product page")}<br>${esc(money(p.price,p.displayPrice))}</div><div class="buttons"><button class="primary" onclick="moveToBag(${i})">Add to Bag</button><button onclick="removeItem(${i})">Remove</button></div></article>`).join("")+'</div>'}
function moveToBag(i){let w=read(WISH_BASE),p=w[i];if(!p)return;let c=read(CART_BASE),key=p.key||`${p.slug||p.productId}::${p.size||"XS"}`,existing=c.find(x=>x.key===key);if(existing)existing.quantity=Math.max(1,Number(existing.quantity)||1)+1;else c.push({...p,key,quantity:Math.max(1,Number(p.quantity)||1)});save(CART_BASE,c);w.splice(i,1);save(WISH_BASE,w);render();alert("Product moved to your bag.")}
function removeItem(i){let w=read(WISH_BASE);w.splice(i,1);save(WISH_BASE,w);render()}
window.renderMarushobhaWishlist=render;window.addEventListener("storage",render);render();
</script><script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
const config={apiKey:"AIzaSyAX2eCSrHatv3p405XJXAq5fMsqVwDP3wQ",authDomain:"marushobha-1e31f.firebaseapp.com",projectId:"marushobha-1e31f",storageBucket:"marushobha-1e31f.firebasestorage.app",messagingSenderId:"997754535596",appId:"1:997754535596:web:aafc83bad8c3d413cf6909"};
const app=getApps().length?getApps()[0]:initializeApp(config);onAuthStateChanged(getAuth(app),user=>{window.marushobhaUid=user?.uid||null;const a=document.getElementById("profileLink");if(a)a.href=user?"index.html#account":"index.html?signin=1&return=wishlist.html";window.renderMarushobhaWishlist?.();});
</script></body></html>
